{% extends 'base.html' %}

{% block title %}Удаление пользователя{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4 text-center text-red-600">Удаление пользователя</h1>

    <p class="text-gray-700 mb-6 text-center">
        Вы уверены, что хотите удалить пользователя
        <strong class="font-bold">{{ user.username }}</strong>?
    </p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div class="flex space-x-4">
            <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition">
                Да, удалить
            </button>
            
            <a href="{% url 'users:list' %}" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded text-center transition">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
