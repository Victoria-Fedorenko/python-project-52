{% extends 'base.html' %}

{% block title %}Метки{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Метки</h1>
    <a href="{% url 'labels:create' %}" 
       class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Создать метку
    </a>
</div>

<table class="min-w-full bg-white border border-gray-200">
    <thead>
        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
            <th class="py-3 px-6 text-left">ID</th>
            <th class="py-3 px-6 text-left">Имя</th>
            <th class="py-3 px-6 text-left">Дата создания</th>
            <th class="py-3 px-6 text-center">Действия</th>
        </tr>
    </thead>
    <tbody class="text-gray-700 text-sm">
        {% for label in labels %}
        <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left">{{ label.id }}</td>
            <td class="py-3 px-6 text-left">{{ label.name }}</td>
            <td class="py-3 px-6 text-left">{{ label.created_at|date:"d.m.Y H:i" }}</td>
            <td class="py-3 px-6 text-center">
                <a href="{% url 'labels:update' label.pk %}" 
                   class="text-blue-600 hover:text-blue-900 mr-4">Изменить</a>
                <a href="{% url 'labels:delete' label.pk %}" 
                   class="text-red-600 hover:text-red-900">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="py-4 text-center text-gray-500">Нет меток</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
